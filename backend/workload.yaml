apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: stackquest-api}
  template:
    metadata:
      labels: {app: stackquest-api}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: docker.io/library/node:24-alpine
          command: ["node", "/app/server.cjs"]
          env: [{name: DATA_FILE, value: /data/stackquest.sqlite}]
          envFrom:
            - secretRef: {name: stackquest-github-oauth, optional: true}
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
          livenessProbe:
            httpGet: {path: /api/health, port: http}
          volumeMounts: [{name: app, mountPath: /app, readOnly: true}, {name: data, mountPath: /data}]
      volumes:
        - name: app
          configMap: {name: stackquest-code}
        - name: data
          persistentVolumeClaim: {claimName: accounts}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: accounts
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: stackquest-api}
  ports: [{port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [stackquest.157.254.207.208.nip.io]
      secretName: stackquest-api-tls
  rules:
    - host: stackquest.157.254.207.208.nip.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: api, port: {number: 80}}
